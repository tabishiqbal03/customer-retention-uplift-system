[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "retention-uplift"
version = "0.4.0"
description = "Synthetic retention experiments, causal uplift models and held-out policy evaluation"
requires-python = ">=3.12"
dependencies = [
    "pyspark==4.2.0", "pyarrow==26.0.0", "numpy==2.5.4",
    "scikit-learn==1.9.1", "scipy==1.18.1", "matplotlib==3.11.2",
    "joblib==1.6.0", "threadpoolctl==3.7.0",
    "fastapi==0.150.0", "pydantic==2.14.1", "uvicorn==0.54.0", "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.1"]

[project.scripts]
retention-data = "retention_uplift.cli:main"
retention-assistant = "retention_uplift.assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: executes real local Spark transformations and storage"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.setuptools.package-data]
"retention_uplift.assistant" = ["index.html"]
