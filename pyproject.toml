[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "retention-uplift"
version = "0.1.0"
description = "Synthetic randomized retention experiment and leakage-safe Spark features"
requires-python = ">=3.11"
dependencies = ["pyspark==4.2.0", "pyarrow==26.0.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.1"]

[project.scripts]
retention-data = "retention_uplift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: executes real local Spark transformations and storage"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
